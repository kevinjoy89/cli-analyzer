name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go tests + build on the primary platforms (Windows included: it is a
  # first-class dev platform for this app and its Wails GUI). The frontend must
  # be built first because main.go embeds frontend/dist (which is git-ignored),
  # so it does not exist in a fresh checkout.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (generates embedded assets)
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      # gofmt 检查用 bash 语法（if [ -n ... ]）；windows-latest 默认 shell
      # 是 PowerShell，必须显式指定 bash（GitHub 会使用 Git for Windows 的 bash）
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -cover

      - name: Build
        run: go build ./...

  # Verify the full Wails GUI pipeline (bindings + frontend + packaging) on
  # macOS, which needs no extra system dependencies beyond the preinstalled
  # Xcode command-line tools.
  wails-build:
    name: Wails GUI build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build GUI app
        run: wails build

  # Verify the full Wails GUI pipeline on Windows too: Windows is a first-class
  # platform for this app (NSIS packaging, WebView2, icon/manifest issues only
  # surface here), so a plain `wails build` must be green on windows-latest.
  wails-build-windows:
    name: Wails GUI build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (generates embedded assets)
        working-directory: frontend
        run: npm run build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build GUI app
        run: wails build
