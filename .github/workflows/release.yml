name: Release

# 打 tag（v*，如 v0.1.0）即构建三平台安装包并创建 GitHub Release。
# 建议 tag 版本与 wails.json 的 productVersion 保持一致。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release 需要写权限来创建 Release

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derive version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # ---- Linux 系统依赖：wails 2.13 默认按 webkit2gtk-4.0 编译（除非
      # -tags webkit2_41 显式切到 4.1），两个 dev 包都装以覆盖两种情况。----
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev build-essential pkg-config

      # ---- macOS：通用二进制 dmg ----
      - name: Install create-dmg (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # macOS runner 预装的 aws/tap 在新版 Homebrew tap-trust 机制下未受信任，
          # 会打印警告；我们用不到它，untap 掉保持日志干净。
          brew untap aws/tap 2>/dev/null || true
          brew install create-dmg

      - name: Build dmg (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # 按芯片分开打包：Apple Silicon (arm64) 与 Intel (amd64) 各一个 dmg。
          # 复制成无空格文件名，避免 release 资产名中的空格被转成点。
          ./scripts/build-dmg.sh arm64
          cp "dist/CLI Analyzer-${VERSION}-arm64.dmg" "dist/CLI-Analyzer-${VERSION}-darwin-arm64.dmg"
          rm "dist/CLI Analyzer-${VERSION}-arm64.dmg"
          ./scripts/build-dmg.sh amd64
          cp "dist/CLI Analyzer-${VERSION}-amd64.dmg" "dist/CLI-Analyzer-${VERSION}-darwin-amd64.dmg"
          rm "dist/CLI Analyzer-${VERSION}-amd64.dmg"

      # ---- Windows：NSIS 安装器 + 便携 zip ----
      # wails -nsis 需要系统里有 makensis，否则会静默跳过安装器生成。
      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis -y

      - name: Build Windows installer and portable zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -nsis
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/*.exe dist/ -Force
          Compress-Archive -Path build/bin/cli-analyzer.exe, build/windows/icon.ico `
            -DestinationPath "dist/CLI-Analyzer-$env:VERSION-windows-amd64-portable.zip" -Force

      # ---- Linux：deb + 便携 tar.gz ----
      - name: Build Linux deb and portable archive
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          wails build -platform linux/amd64
          mkdir -p dist
          # deb 中间目录放临时路径，dist/ 只保留最终产物（否则 upload-artifact
          # 会把 deb 内部的二进制/desktop/control 也带上 release）。
          DEB_DIR="$(mktemp -d)"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/bin" "$DEB_DIR/usr/share/applications"
          cp build/bin/cli-analyzer "$DEB_DIR/usr/bin/"
          cat > "$DEB_DIR/usr/share/applications/cli-analyzer.desktop" <<'EOF'
          [Desktop Entry]
          Name=CLI Analyzer
          Comment=Scan and clean CLI tool disk usage
          Exec=cli-analyzer
          Type=Application
          Terminal=false
          Categories=Utility;
          EOF
          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: cli-analyzer
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: kevinjoy89
          Description: Scan and clean CLI tool disk usage
          EOF
          dpkg-deb --build --root-owner-group "$DEB_DIR" "dist/CLI-Analyzer-${VERSION}-linux-amd64.deb"
          tar -czf "dist/CLI-Analyzer-${VERSION}-linux-amd64.tar.gz" -C build/bin cli-analyzer

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
