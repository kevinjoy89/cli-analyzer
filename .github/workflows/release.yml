name: Release

# 打 tag（v*，如 v0.1.0）即构建三平台安装包并创建 GitHub Release。
# 建议 tag 版本与 wails.json 的 productVersion 保持一致（工作流会在构建前自动覆写）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release 需要写权限来创建 Release

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derive version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 版本单一来源：构建前用 tag 覆写 wails.json 的 productVersion，
      # 让安装包元数据与 dmg 文件名与 tag 保持一致（design D1）。
      - name: Stamp version into wails.json
        shell: bash
        run: |
          sed -i.bak "s/\"productVersion\": *\"[^\"]*\"/\"productVersion\": \"${VERSION}\"/" wails.json
          rm -f wails.json.bak

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # ---- Linux 系统依赖：wails 2.13 默认按 webkit2gtk-4.0 编译（除非
      # -tags webkit2_41 显式切到 4.1），两个 dev 包都装以覆盖两种情况。----
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev build-essential pkg-config

      # ---- macOS：通用二进制 dmg ----
      # build-dmg.sh 内部注入 Version + InstallSource=dmg 的 ldflags。
      - name: Install create-dmg (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # macOS runner 预装的 aws/tap 在新版 Homebrew tap-trust 机制下未受信任，
          # 会打印警告；我们用不到它，untap 掉保持日志干净。
          brew untap aws/tap 2>/dev/null || true
          brew install create-dmg

      - name: Build dmg (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # 按芯片分开打包：Apple Silicon (arm64) 与 Intel (amd64) 各一个 dmg。
          # 复制成无空格文件名，避免 release 资产名中的空格被转成点。
          ./scripts/build-dmg.sh arm64
          cp "dist/CLI Analyzer-${VERSION}-arm64.dmg" "dist/CLI-Analyzer-${VERSION}-macos-arm64.dmg"
          rm "dist/CLI Analyzer-${VERSION}-arm64.dmg"
          ./scripts/build-dmg.sh amd64
          cp "dist/CLI Analyzer-${VERSION}-amd64.dmg" "dist/CLI-Analyzer-${VERSION}-macos-amd64.dmg"
          rm "dist/CLI Analyzer-${VERSION}-amd64.dmg"
          # 校验和（macOS 无 sha256sum，用 shasum -a 256；输出格式与 sha256sum 兼容）
          cd dist && shasum -a 256 * > checksums.txt

      # ---- Windows：NSIS 安装器 + 便携 zip ----
      # wails -nsis 需要 makensis。choco 把 NSIS 写入系统 PATH，但 runner 当前
      # 进程的环境不会自动刷新，所以装完必须在同一 step 内把 NSIS 目录加进
      # PATH 再构建，否则 wails 会静默跳过安装器生成。
      # 构建两次注入不同 InstallSource：installer（装进 NSIS）与 portable（打 zip）。
      - name: Build Windows installer and portable zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y
          $env:Path = "$env:Path;C:\Program Files (x86)\NSIS"
          New-Item -ItemType Directory -Force dist | Out-Null
          # 1) installer flavor：NSIS 安装器内嵌携带 installer 标识的 exe
          wails build -platform windows/amd64 -nsis -ldflags "-X cli-analyzer/internal/buildinfo.Version=$env:VERSION -X cli-analyzer/internal/buildinfo.InstallSource=installer"
          # wails 输出 <产品名>-<arch>-installer.exe（产品名含空格），用通配匹配，
          # 重命名为带版本号，与其他平台产物命名一致。
          Copy-Item "build/bin/*-installer.exe" "dist/CLI-Analyzer-$env:VERSION-windows-amd64-installer.exe"
          # 2) portable flavor：重建普通 exe（携带 portable 标识）后打 zip
          wails build -platform windows/amd64 -ldflags "-X cli-analyzer/internal/buildinfo.Version=$env:VERSION -X cli-analyzer/internal/buildinfo.InstallSource=portable"
          Compress-Archive -Path build/bin/cli-analyzer.exe, build/windows/icon.ico `
            -DestinationPath "dist/CLI-Analyzer-$env:VERSION-windows-amd64-portable.zip" -Force
          # 校验和：输出与 sha256sum 兼容的 "<hex>  <name>" 格式。
          # 先收集到变量再写文件：流式管道会先锁定目标文件，而 Get-ChildItem
          # 枚举 dist/ 时会把刚创建的 checksums.txt 也列进去导致 Get-FileHash 撞锁。
          $sums = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'checksums.txt' } | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
          }
          $sums | Out-File -Encoding ascii dist/checksums.txt

      # ---- Linux：deb + 便携 tar.gz ----
      # 构建两次注入不同 InstallSource：deb 与 tarball（同一源码，仅标识不同）。
      - name: Build Linux deb and portable archive
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          LDFLAGS="-X cli-analyzer/internal/buildinfo.Version=${VERSION} -X cli-analyzer/internal/buildinfo.InstallSource="
          wails build -platform linux/amd64 -ldflags "${LDFLAGS}deb"
          cp build/bin/cli-analyzer /tmp/cli-analyzer-deb
          wails build -platform linux/amd64 -ldflags "${LDFLAGS}tarball"
          cp build/bin/cli-analyzer /tmp/cli-analyzer-tarball
          mkdir -p dist
          # deb 中间目录放临时路径，dist/ 只保留最终产物（否则 upload-artifact
          # 会把 deb 内部的二进制/desktop/control 也带上 release）。
          DEB_DIR="$(mktemp -d)"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/bin" \
            "$DEB_DIR/usr/share/applications" "$DEB_DIR/usr/share/pixmaps"
          cp /tmp/cli-analyzer-deb "$DEB_DIR/usr/bin/"
          cp build/appicon.png "$DEB_DIR/usr/share/pixmaps/cli-analyzer.png"
          cat > "$DEB_DIR/usr/share/applications/cli-analyzer.desktop" <<'EOF'
          [Desktop Entry]
          Name=CLI Analyzer
          Comment=Scan and clean CLI tool disk usage
          Exec=cli-analyzer
          Icon=cli-analyzer
          Type=Application
          Terminal=false
          Categories=Utility;
          EOF
          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: cli-analyzer
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: kevinjoy89
          Description: Scan and clean CLI tool disk usage
          EOF
          dpkg-deb --build --root-owner-group "$DEB_DIR" "dist/CLI-Analyzer-${VERSION}-linux-amd64.deb"
          cp /tmp/cli-analyzer-tarball /tmp/cli-analyzer
          tar -czf "dist/CLI-Analyzer-${VERSION}-linux-amd64.tar.gz" -C /tmp cli-analyzer
          # 校验和
          cd dist && sha256sum * > checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
