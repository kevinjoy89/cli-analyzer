<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CLI Analyzer</title>
</head>
<body>
<div id="app">
    <div id="menuBar" class="menu-bar">
        <div class="menu-item">
            <button class="menu-btn" data-pop="file" data-i18n="menu.file">文件</button>
            <div class="menu-pop" data-pop="file">
                <button class="menu-opt" data-act="prefs" data-i18n="menu.prefs">首选项…</button>
                <button class="menu-opt" data-act="quit" data-i18n="menu.quit">退出</button>
            </div>
        </div>
        <div class="menu-item">
            <button class="menu-btn" data-pop="help" data-i18n="menu.help">帮助</button>
            <div class="menu-pop" data-pop="help">
                <button class="menu-opt" data-act="check-updates" data-i18n="menu.checkUpdates">检查更新…</button>
                <button class="menu-opt" data-act="about" data-i18n="menu.about">关于 CLI Analyzer</button>
                <button class="menu-opt" data-act="github" data-i18n="menu.github">GitHub 仓库</button>
                <button class="menu-opt" data-act="issue" data-i18n="menu.issue">反馈问题</button>
            </div>
        </div>
    </div>

    <header id="header">
        <div class="brand">
            <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><path d="M3 10 C 7 6, 10 14, 14 11 S 19 6, 21 8 L21 18 C 17 16, 13 20, 9 17 S 5 13, 3 15 Z" fill="url(#lg)"/></svg></span>
            <h1>CLI Analyzer</h1>
            <span id="lastScan" class="muted"></span>
        </div>
        <div class="header-actions">
            <button id="trendsBtn" class="btn" data-i18n="menu.trends" data-i18n-title="menu.trendsTitle">趋势</button>
            <button id="rescanBtn" class="btn primary" data-i18n="menu.rescan">重新扫描</button>
            <button id="bellBtn" class="bell-btn hidden" data-i18n-title="menu.reminder" title="待清理提醒">
                <span class="bell-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
                <span id="bellCount" class="bell-count"></span>
            </button>
        </div>
        <div id="bellPanel" class="bell-panel"></div>
    </header>

    <section id="summary" class="summary">
        <div class="stat"><span class="stat-label" data-i18n="ui.statFootprint">总占用</span><span id="sumFootprint" class="stat-value">–</span></div>
        <div class="stat"><span class="stat-label" data-i18n="ui.statCleanable">可安全清理</span><span id="sumCleanable" class="stat-value clean">–</span></div>
        <div class="stat"><span class="stat-label" data-i18n="ui.statUser">用户数据</span><span id="sumUser" class="stat-value user">–</span></div>
        <div class="stat"><span class="stat-label" data-i18n="ui.statTools">工具数</span><span id="sumTools" class="stat-value">–</span></div>
        <div class="stat hidden" id="orphanStat">
            <span class="stat-label" data-i18n="ui.orphanSection">未认领数据</span>
            <span id="sumOrphan" class="stat-value amber">–</span>
        </div>
    </section>

    <main id="layout">
        <section id="toolPanel" class="panel">
            <div class="panel-head">
                <div id="panelTabs" class="tabs"></div>
                <input id="filter" class="filter" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="ui.filterPlaceholder" placeholder="过滤工具…"/>
            </div>
            <div id="toolList" class="tool-list"></div>
        </section>

        <section id="detailPanel" class="panel detail">
            <div id="detailBody" class="detail-body">
                <div class="empty" data-i18n="ui.selectTool">← 选择一个工具查看详情</div>
            </div>
        </section>
    </main>

    <footer id="statusBar" class="status-bar">
        <span id="scanState" class="scan-state hidden"></span>
        <span id="statusInfo" class="status-info"></span>
        <button id="trashBtn" class="trash-btn" data-i18n-title="ui.trashBtnTitle" title="内置回收站：清理项在保留期内可恢复"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> <span data-i18n="ui.trashBtn">内置回收站</span> <b id="trashInfo">–</b></button>
        <button id="themeBtn" class="theme-btn" data-i18n-title="ui.themeToggle" title="切换主题：跟随系统 / 明亮 / 暗黑">
            <span id="themeIcon">◐</span>
        </button>
        <span id="appVersion" class="foot-version"></span>
    </footer>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-box">
        <h3 id="modalTitle" data-i18n="ui.confirmCleanTitle">确认清理</h3>
        <div id="modalBody" class="modal-body"></div>
        <div class="modal-actions">
            <button id="modalCancel" class="btn" data-i18n="ui.cancel">取消</button>
            <button id="modalConfirm" class="btn danger" data-i18n="ui.confirmCleanBtn">确认清理</button>
        </div>
    </div>
</div>

<div id="trashModal" class="modal hidden">
    <div class="modal-box wide">
        <div class="trash-bar">
            <h3 data-i18n="ui.trashBtn">内置回收站</h3>
            <span id="trashSummary" class="trash-sum"></span>
            <button id="trashPurgeAll" class="btn ghost-danger" data-i18n="ui.emptyTrash">清空回收站</button>
        </div>
        <div id="trashBody" class="modal-body trash-list"></div>
        <div class="modal-actions">
            <button id="trashClose" class="btn" data-i18n="ui.close">关闭</button>
        </div>
    </div>
</div>

<div id="prefsModal" class="modal hidden">
    <div class="modal-box prefs">
        <h3 data-i18n="ui.prefsTitle">首选项</h3>
        <div id="prefsBody" class="modal-body"></div>
        <div class="modal-actions">
            <button id="prefsCancel" class="btn" data-i18n="ui.cancel">取消</button>
            <button id="prefsSave" class="btn primary" data-i18n="ui.save">保存</button>
        </div>
    </div>
</div>

<div id="trendsModal" class="modal hidden">
    <div class="modal-box wide-lg">
        <h3 data-i18n="ui.trendsModalTitle">占用趋势</h3>
        <div id="trendsBody" class="modal-body">
            <div id="trendChart" class="trend-chart"></div>
            <div class="trend-section">
                <h4 data-i18n="ui.growersTop5">可清理增量 Top 5</h4>
                <div id="trendGrowers" class="trend-growers"></div>
            </div>
        </div>
        <div class="modal-actions">
            <button id="trendsClose" class="btn" data-i18n="ui.close">关闭</button>
        </div>
    </div>
</div>

<div id="aboutModal" class="modal hidden">
    <div class="modal-box about">
        <div class="about-body">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><path d="M3 10 C 7 6, 10 14, 14 11 S 19 6, 21 8 L21 18 C 17 16, 13 20, 9 17 S 5 13, 3 15 Z" fill="url(#lg2)"/></svg>
            <h2>CLI Analyzer</h2>
            <div id="aboutVersion" class="about-version"></div>
            <p data-i18n="menu.aboutBody">扫描并清理 CLI 工具的磁盘占用。</p>
            <a id="aboutLink" class="meta-link" href="#">GitHub ↗</a>
        </div>
        <div class="modal-actions">
            <button id="aboutClose" class="btn" data-i18n="ui.close">关闭</button>
        </div>
    </div>
</div>

<div id="updateModal" class="modal hidden">
    <div class="modal-box update">
        <h3 data-i18n="ui.updateTitle">软件更新</h3>
        <div id="updateBody" class="modal-body"></div>
    </div>
</div>

<div id="uninstallModal" class="modal hidden">
    <div class="modal-box update">
        <h3 id="uninstallTitle" data-i18n="un.guiUninstall">卸载</h3>
        <div id="uninstallBody" class="modal-body"></div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="./src/main.ts" type="module"></script>
</body>
</html>
