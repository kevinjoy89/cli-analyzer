<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CLI Analyzer</title>
</head>
<body>
<div id="app">
    <header id="header">
        <div class="brand">
            <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><path d="M3 10 C 7 6, 10 14, 14 11 S 19 6, 21 8 L21 18 C 17 16, 13 20, 9 17 S 5 13, 3 15 Z" fill="url(#lg)"/></svg></span>
            <h1>CLI Analyzer</h1>
            <span id="lastScan" class="muted"></span>
        </div>
        <div class="header-actions">
            <span id="scanState" class="scan-state"></span>
            <button id="rescanBtn" class="btn primary">重新扫描</button>
        </div>
    </header>

    <section id="summary" class="summary">
        <div class="stat"><span class="stat-label">总占用</span><span id="sumFootprint" class="stat-value">–</span></div>
        <div class="stat"><span class="stat-label">可安全清理</span><span id="sumCleanable" class="stat-value clean">–</span></div>
        <div class="stat"><span class="stat-label">用户数据</span><span id="sumUser" class="stat-value user">–</span></div>
        <div class="stat"><span class="stat-label">工具数</span><span id="sumTools" class="stat-value">–</span></div>
    </section>

    <main id="layout">
        <section id="toolPanel" class="panel">
            <div class="panel-head">
                <input id="filter" class="filter" type="text" placeholder="过滤工具…"/>
            </div>
            <div id="toolList" class="tool-list"></div>
        </section>

        <section id="detailPanel" class="panel detail">
            <div id="detailBody" class="detail-body">
                <div class="empty">← 选择一个工具查看详情</div>
            </div>
        </section>
    </main>

    <footer id="statusBar" class="status-bar">
        <span id="statusInfo" class="status-info"></span>
        <button id="themeBtn" class="theme-btn" title="切换主题：跟随系统 / 明亮 / 暗黑">
            <span id="themeIcon">◐</span>
        </button>
        <span id="appVersion" class="foot-version"></span>
    </footer>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-box">
        <h3 id="modalTitle">确认清理</h3>
        <div id="modalBody" class="modal-body"></div>
        <div class="modal-actions">
            <button id="modalCancel" class="btn">取消</button>
            <button id="modalConfirm" class="btn danger">确认清理</button>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="./src/main.ts" type="module"></script>
</body>
</html>
